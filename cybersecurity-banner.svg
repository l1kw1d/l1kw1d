  <radialGradient id="aura"><stop stop-color="#9e40ff" stop-opacity=".27"/><stop offset="1" stop-color="#9e40ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9d5ff" stroke-opacity=".055"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

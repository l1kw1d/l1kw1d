<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Jonathan Provost, cybersecurity analyst</title>
<desc id="desc">A cinematic anime-inspired cyberpunk illustration with the message: Think like an attacker. Build for resilience.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b15"/><stop offset=".52" stop-color="#11182a"/><stop offset="1" stop-color="#090e19"/></linearGradient>
  <linearGradient id="flare" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#13d9c1" stop-opacity="0"/><stop offset=".52" stop-color="#13d9c1" stop-opacity=".8"/><stop offset="1" stop-color="#ba63ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171c32"/><stop offset=".6" stop-color="#394265"/><stop offset="1" stop-color="#101421"/></linearGradient>
